services:
  - type: web
    name: ibuscribe-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ABDM_CLIENT_ID
        sync: false
      - key: ABDM_CLIENT_SECRET
        sync: false
      - key: ABDM_GATEWAY_URL
        value: https://dev.abdm.gov.in
      - key: DATABASE_URL
        fromDatabase:
          name: ibuscribe-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: ibuscribe-db
    databaseName: ibuscribe
    user: ibuscribe
    plan: free
